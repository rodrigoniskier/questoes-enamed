<section class="submit-actions" aria-label="Enviar questão">
    <div><h2>Questão pronta para revisão?</h2><p>Confira os campos e marque as diretrizes para liberar o envio.</p></div>
    <div class="submit-buttons">
        <button type="submit" name="submit_action" value="same_style" disabled class="action-primary">Enviar e criar outra no mesmo estilo</button>
        <button type="submit" name="submit_action" value="other_style" disabled class="action-secondary">Enviar e selecionar outro estilo de questão</button>
        <button type="submit" name="submit_action" value="finish" disabled class="action-tertiary">Enviar e concluir</button>
    </div>
    <p id="submit-status" role="status" aria-live="polite"></p>
</section>
