{% include "django/forms/widgets/textarea.html" %}
<button type="button" class="btn btn-outline-info mt-2" onclick="const campo = document.getElementById('{{ widget.attrs.id|escapejs }}'); if (!campo.value.trim() || confirm('Substituir as combinações preenchidas pelas combinações atualmente utilizadas?')) { campo.value = campo.dataset.combinacoes || ''; campo.dispatchEvent(new Event('input', {bubbles: true})); }">Carregar combinações atuais para editar</button>
<p class="mt-2">Apague as quatro linhas para voltar à geração automática. As alterações serão aplicadas ao salvar a questão.</p>
