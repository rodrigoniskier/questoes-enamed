name: Quality
on: [push, pull_request]
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check questoes bulk_submit gerador_provas
      - run: python -m ruff format --check questoes bulk_submit gerador_provas
      - run: python manage.py test --settings=gerador_provas.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=gerador_provas.test_settings
      - run: python -m pip_audit -r requirements.txt
