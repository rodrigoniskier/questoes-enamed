name: Quality
on: [push, pull_request]
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check questoes bulk_submit gerador_provas pre_auditoria ops/deploy_importacao.py ops/test_deploy_importacao.py ops/verify_integrity.py
      - run: python -m ruff format --check questoes bulk_submit gerador_provas pre_auditoria ops/deploy_importacao.py ops/test_deploy_importacao.py ops/verify_integrity.py
      - run: python -m unittest ops.test_deploy_importacao
      - run: python manage.py test --settings=gerador_provas.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=gerador_provas.test_settings
      - run: python -m pip_audit -r requirements.txt
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test questoes.test_importacao_browser --settings=gerador_provas.test_settings
        env:
          RUN_BROWSER_TESTS: '1'
