name: Quality
on: [push, pull_request]
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check questoes bulk_submit gerador_provas pre_auditoria ops/deploy_importacao.py ops/test_deploy_importacao.py ops/verify_integrity.py
      - run: python -m ruff format --check questoes bulk_submit gerador_provas pre_auditoria ops/deploy_importacao.py ops/test_deploy_importacao.py ops/verify_integrity.py
      - run: python -m unittest ops.test_deploy_importacao
      - run: python manage.py test --settings=gerador_provas.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=gerador_provas.test_settings
      - run: python -m pip_audit -r requirements.txt
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt playwright==1.64.1
      - name: Usar Chrome instalado no runner
        run: |
          import_browser_path="$(command -v google-chrome)"
          test -x "$import_browser_path"
          "$import_browser_path" --version
          printf 'BROWSER_EXECUTABLE=%s\n' "$import_browser_path" >> "$GITHUB_ENV"
      - run: python manage.py test questoes.test_importacao_browser pre_auditoria.test_browser --settings=gerador_provas.test_settings
        env:
          RUN_BROWSER_TESTS: '1'
          BROWSER_SCREENSHOT: '${{ runner.temp }}/enamed-qa/tela.png'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas-regressao
          path: '${{ runner.temp }}/enamed-qa/*.png'
          if-no-files-found: ignore
